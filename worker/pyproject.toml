[project]
name = "song-worker"
version = "0.2.0"
description = "Pipeline: YouTube audio -> vocals -> word timestamps -> lessons -> TTS -> Supabase"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy audio/ML stack — install with: uv sync --extra pipeline
# CPU-only torch is pulled from the PyTorch CPU index (see [tool.uv.sources]).
pipeline = [
    "yt-dlp>=2026.10.26",
    "demucs>=4.1.0",
    "whisperx>=3.8.6",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "fugashi>=1.5",
    "unidic-lite>=1.0.8",
]
# p3 = ["anthropic", "pykakasi", "phonemizer", "g2pk", "korean-romanizer"]
# p5 = ["librosa"]

[project.scripts]
song-worker = "song_worker.cli:main"
gen-models = "song_worker.codegen:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "datamodel-code-generator>=0.26",
]

[tool.uv]
# The worker runs on Linux x86_64 only (dev machine: Ubuntu, CI: ubuntu-latest, cloud: Linux).
# Without this, uv also resolves for Intel macOS, where demucs pins torch<2.3 and conflicts
# with whisperx's torch~=2.8.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch ={ index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/song_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/song_worker/timeline.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
