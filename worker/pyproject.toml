[project]
name = "song-worker"
version = "0.0.1"
description = "Pipeline: YouTube audio -> vocals -> word timestamps -> lessons -> TTS -> Supabase"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Added for real in later phases; listed here so the plan is visible.
# p2 = ["yt-dlp", "demucs", "whisperx", "supabase"]
# p3 = ["anthropic", "pykakasi", "phonemizer", "g2pk", "korean-romanizer"]
# p5 = ["librosa"]

[project.scripts]
song-worker = "song_worker.cli:main"
gen-models = "song_worker.codegen:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/song_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/song_worker/timeline.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
